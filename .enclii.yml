apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: phynd-crm-web
  project: phynd-crm
  description: Phynd CRM production web app and Janua-backed client/admin portal.
spec:
  build:
    type: dockerfile
    context: .
    dockerfile: docker/Dockerfile.web
    source:
      git:
        repository: https://github.com/madfam-org/phynd-crm
        branch: main
        autoDeploy: true
  runtime:
    port: 3000
    replicas: 2
    healthCheck: /api/health
  environment:
    NODE_ENV: production
    NEXT_PUBLIC_APP_URL: https://phynd.app
    AUTH_TRUST_HOST: "true"
    AUTH_JANUA_ISSUER: https://auth.madfam.io
  domains:
    - name: phynd.app
      environment: production
      tlsEnabled: true
    - name: www.phynd.app
      environment: production
      tlsEnabled: true
    - name: app.phynd.app
      environment: production
      tlsEnabled: true
    - name: admin.phynd.app
      environment: production
      tlsEnabled: true
    - name: api.phynd.app
      environment: production
      tlsEnabled: true
    - name: crm.madfam.io
      environment: production
      tlsEnabled: true
promotion:
  pattern: manual
  min_soak_minutes: 30
  require_smoke_pass: true
