apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: phynd-crm-web
  project: phynd-crm
  description: Phynd CRM production web app and Janua-backed client/admin portal.
spec:
  build:
    type: dockerfile
    context: .
    dockerfile: docker/Dockerfile.web
    source:
      git:
        repository: https://github.com/madfam-org/phynd-crm
        branch: main
        autoDeploy: true
  runtime:
    port: 3000
    replicas: 2
    healthCheck: /api/health
  env:
    - name: NODE_ENV
      value: production
    - name: NEXT_PUBLIC_APP_URL
      value: https://phynd.app
    - name: AUTH_TRUST_HOST
      value: "true"
    - name: AUTH_JANUA_ISSUER
      value: https://auth.madfam.io
  # Domain truth (verified live 2026-07-09): only the domains below serve
  # traffic. app/admin/api.phynd.app were declared here but NXDOMAIN in DNS
  # (never provisioned) and contradicted the README's production-domain policy,
  # so they were removed; crm.phynd.app was live but undeclared, so it was
  # added. Reconcile via `enclii domains` — do not re-add dead names here.
  domains:
    - name: phynd.app
      environment: production
      tlsEnabled: true
    - name: www.phynd.app
      environment: production
      tlsEnabled: true
    - name: crm.phynd.app
      environment: production
      tlsEnabled: true
    - name: crm.madfam.io
      environment: production
      tlsEnabled: true
    - name: staging-crm.madfam.io
      environment: staging
      tlsEnabled: true
promotion:
  pattern: manual
  min_soak_minutes: 30
  require_smoke_pass: true
