name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  networkpolicy-port-lint:
    name: NetworkPolicy port consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Prevents the 2026-05-04 status.enclii.dev outage class:
    # NetworkPolicy `ports:` clauses that don't intersect the selected pods'
    # containerPorts (silent CNI drop, hours to diagnose).
    # See scripts/check-networkpolicy-ports.py for full rationale.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run NetworkPolicy port lint
        run: python3 scripts/check-networkpolicy-ports.py infra/k8s/

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  stability-guardrails:
    name: PP5 Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PP5 stability guardrails
        run: node scripts/pp5-stability-check.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, stability-guardrails]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, stability-guardrails]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://phynd:phynd@localhost:5432/phynd_crm
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-test-secret-minimum-16
          AUTH_JANUA_ISSUER: https://janua.example.com
          AUTH_JANUA_CLIENT_ID: ci-client-id
          AUTH_JANUA_CLIENT_SECRET: ci-client-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JANUA_API_URL: http://localhost:4001
          DHANAM_API_URL: http://localhost:4002
          COTIZA_API_URL: http://localhost:4003
          PRAVARA_BASE_URL: http://localhost:4004
          FORJ_API_URL: http://localhost:4005
          PRAVARA_API_KEY: ci-pravara-key
          JANUA_TELEMETRY_API_URL: http://localhost:4006
          KARAFIEL_API_URL: http://localhost:4007
          KARAFIEL_API_KEY: ci-karafiel-key
