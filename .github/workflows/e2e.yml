name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: phynd
          POSTGRES_PASSWORD: phynd
          POSTGRES_DB: phynd_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phynd -d phynd_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgresql://phynd:phynd@localhost:5432/phynd_crm
      - run: pnpm --filter @phynd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @phynd/web test:e2e
        env:
          DATABASE_URL: postgresql://phynd:phynd@localhost:5432/phynd_crm
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: e2e-test-secret-minimum-16
          AUTH_BYPASS: "true"
          AUTH_JANUA_ISSUER: https://janua.example.com
          AUTH_JANUA_CLIENT_ID: e2e-client-id
          AUTH_JANUA_CLIENT_SECRET: e2e-client-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          PORTAL_BASE_URL: http://localhost:3000
          JANUA_API_URL: http://127.0.0.1:4001
          DHANAM_API_URL: http://localhost:4002
          COTIZA_API_URL: http://localhost:4003
          PRAVARA_BASE_URL: http://localhost:4004
          FORJ_API_URL: http://localhost:4005
          PRAVARA_API_KEY: e2e-pravara-key
          JANUA_WEBHOOK_SECRET: e2e-webhook-secret
          DHANAM_WEBHOOK_SECRET: e2e-webhook-secret
          COTIZA_WEBHOOK_SECRET: e2e-webhook-secret
          PRAVARA_WEBHOOK_SECRET: e2e-webhook-secret
          FORJ_WEBHOOK_SECRET: e2e-webhook-secret
          FORTUNA_WEBHOOK_SECRET: e2e-fortuna-webhook-secret-min16
          KARAFIEL_API_URL: http://localhost:4007
          KARAFIEL_API_KEY: e2e-karafiel-key
          KARAFIEL_WEBHOOK_SECRET: e2e-karafiel-webhook-secret
