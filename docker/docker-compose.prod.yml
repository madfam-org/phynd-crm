services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phyne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phyne_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phyne -d phyne_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://phyne:${POSTGRES_PASSWORD}@postgres:5432/phyne_crm
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_JANUA_ISSUER: ${AUTH_JANUA_ISSUER}
      AUTH_JANUA_CLIENT_ID: ${AUTH_JANUA_CLIENT_ID}
      AUTH_JANUA_CLIENT_SECRET: ${AUTH_JANUA_CLIENT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JANUA_API_URL: ${JANUA_API_URL}
      JANUA_TELEMETRY_API_URL: ${JANUA_TELEMETRY_API_URL:-}
      DHANAM_API_URL: ${DHANAM_API_URL}
      COTIZA_API_URL: ${COTIZA_API_URL}
      PRAVARA_BASE_URL: ${PRAVARA_BASE_URL}
      FORJ_API_URL: ${FORJ_API_URL}
      PRAVARA_API_KEY: ${PRAVARA_API_KEY}
      JANUA_WEBHOOK_SECRET: ${JANUA_WEBHOOK_SECRET}
      DHANAM_WEBHOOK_SECRET: ${DHANAM_WEBHOOK_SECRET}
      COTIZA_WEBHOOK_SECRET: ${COTIZA_WEBHOOK_SECRET}
      PRAVARA_WEBHOOK_SECRET: ${PRAVARA_WEBHOOK_SECRET}
      FORJ_WEBHOOK_SECRET: ${FORJ_WEBHOOK_SECRET}
      # Tezca CRM integration (newsletter + interest → contact/lead/drip)
      TEZCA_WEBHOOK_SECRET: ${TEZCA_WEBHOOK_SECRET}
      TEZCA_API_URL: ${TEZCA_API_URL:-https://api.tezca.mx}
      INTERNAL_TEZCA_KEY: ${INTERNAL_TEZCA_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Reddit bot (Fortuna signal → outreach)
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_REFRESH_TOKEN: ${REDDIT_REFRESH_TOKEN:-}
      REDDIT_BOT_USERNAME: ${REDDIT_BOT_USERNAME:-madfam-bot}
      # ACCA Treasury Hunter (Phase 3)
      FORTUNA_WEBHOOK_SECRET: ${FORTUNA_WEBHOOK_SECRET}
      KARAFIEL_API_URL: ${KARAFIEL_API_URL}
      KARAFIEL_API_KEY: ${KARAFIEL_API_KEY}
      KARAFIEL_WEBHOOK_SECRET: ${KARAFIEL_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://phyne:${POSTGRES_PASSWORD}@postgres:5432/phyne_crm
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JANUA_API_URL: ${JANUA_API_URL}
      JANUA_TELEMETRY_API_URL: ${JANUA_TELEMETRY_API_URL:-}
      DHANAM_API_URL: ${DHANAM_API_URL}
      COTIZA_API_URL: ${COTIZA_API_URL}
      PRAVARA_BASE_URL: ${PRAVARA_BASE_URL}
      FORJ_API_URL: ${FORJ_API_URL}
      PRAVARA_API_KEY: ${PRAVARA_API_KEY}
      # Email drip automation
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TEZCA_PUBLIC_URL: ${TEZCA_API_URL:-https://tezca.mx}
      # ACCA Treasury Hunter (Phase 3)
      KARAFIEL_API_URL: ${KARAFIEL_API_URL}
      KARAFIEL_API_KEY: ${KARAFIEL_API_KEY}
      KARAFIEL_WEBHOOK_SECRET: ${KARAFIEL_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
