apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: phynd-crm
  project: phynd-crm
spec:
  # status.madfam.io tracking — PhyndCRM declares all 4 canonical
  # product surfaces (the symbiosis-hcm precedent, PR #8). Surfaces
  # not yet deployed will show red on the status page until first
  # roll-out; this is by design — surfacing the deployment gap is
  # the whole point of pre-declaring.
  #
  # Runtime + network sections will be added when the service is
  # fully onboarded for deploy through the platform pipeline.
  # Until then, the entries below are the zero-touch source-of-truth
  # for status.madfam.io. The platform regenerate handler
  # (`POST /v1/admin/status/regenerate`, enclii#162) projects them into
  # `apps/status/k8s/madfam/configmap.yaml`. This replaces the manual
  # configmap edit that landed in enclii#160 (zero-touch policy
  # violation, see internal-devops/rfcs/0014 for the policy).
  status:
    enabled: true
    entries:
      - name: PhyndCRM
        url: https://phynd.app
        href: https://phynd.app
        assertNotContains: 'localhost:3000'
        group: PhyndCRM
        family: MADFAM Platform
        description: Marketing landing page (currently served by the Next.js app's `/` route)
      - name: PhyndCRM App
        url: https://app.phynd.app
        href: https://app.phynd.app
        group: PhyndCRM
        family: MADFAM Platform
        description: Authenticated CRM workspace routed through Enclii
      - name: PhyndCRM Admin
        url: https://admin.phynd.app
        href: https://admin.phynd.app
        group: PhyndCRM
        family: MADFAM Platform
        description: Operator admin console (planned, not yet deployed)
      - name: PhyndCRM API
        url: https://api.phynd.app/api/health
        href: https://api.phynd.app
        group: PhyndCRM
        family: MADFAM Platform
        description: Synthetic single pane of glass — federates Janua, Janua Telemetry, Dhanam, Cotiza, PravaraMES, Forj (planned, not yet deployed)
