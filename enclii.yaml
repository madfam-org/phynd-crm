apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: phynd-crm
  project: phynd-crm
spec:
  # status.madfam.io tracking — PhyndCRM declares only the canonical
  # externally truthful surfaces. Surfaces not yet deployed will show
  # red on the status page until first roll-out; this is by design.
  #
  # Runtime + network sections will be added when the service is
  # fully onboarded for deploy through the platform pipeline.
  # Until then, the entries below are the zero-touch source-of-truth
  # for status.madfam.io. The platform regenerate handler
  # (`POST /v1/admin/status/regenerate`, enclii#162) projects them into
  # `apps/status/k8s/madfam/configmap.yaml`. This replaces the manual
  # configmap edit that landed in enclii#160 (zero-touch policy
  # violation, see internal-devops/rfcs/0014 for the policy).
  status:
    enabled: true
    entries:
      - name: Phynd Landing
        url: https://phynd.app
        href: https://phynd.app
        assertContains: github.com/madfam-org/phynd-crm
        group: PhyndCRM
        family: MADFAM Platform
        description: Public Phynd landing page
      - name: PhyndCRM MADFAM Slice
        url: https://crm.madfam.io
        href: https://crm.madfam.io
        group: PhyndCRM
        family: MADFAM Platform
        description: MADFAM tenant slice; root must redirect to the Janua SSO login surface
        assertContains: Sign in with your MADFAM Janua SSO account
      - name: PhyneCRM App
        url: https://app.phyne.app
        href: https://app.phyne.app
        group: PhyndCRM
        family: MADFAM Platform
        description: Generic authenticated PhyneCRM app host for non-MADFAM tenants
        assertContains: Sign in with Janua SSO
      - name: PhyndCRM API
        url: https://phynd.app/api/health
        href: https://phynd.app
        group: PhyndCRM
        family: MADFAM Platform
        description: Primary PhyndCRM health endpoint
