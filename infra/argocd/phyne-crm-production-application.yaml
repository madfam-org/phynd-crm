apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phyne-crm-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/madfam-org/phyne-crm.git
    targetRevision: main
    path: infra/k8s/production
  destination:
    server: https://kubernetes.default.svc
    namespace: phyne-crm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 5
