apiVersion: apps/v1
kind: Deployment
metadata:
  name: phyne-crm-worker
  labels:
    app: phyne-crm-worker
    app.kubernetes.io/name: phyne-crm-worker
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phyne-crm-worker
  template:
    metadata:
      labels:
        app: phyne-crm-worker
        app.kubernetes.io/name: phyne-crm-worker
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/madfam-org/phyne-crm/worker:latest
          ports:
            - name: health
              containerPort: 3001
          env:
            - name: WORKER_HEALTH_PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: phyne-crm-secrets
            - secretRef:
                name: phyne-acca-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 30
