apiVersion: apps/v1
kind: Deployment
metadata:
  name: phynd-crm-web
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          envFrom:
            - secretRef:
                name: phynd-crm-staging-secrets
            - secretRef:
                name: phynd-crm-staging-pilot-overlay
            - secretRef:
                name: phynd-acca-staging-secrets
                optional: true
