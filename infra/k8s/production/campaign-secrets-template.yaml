# OPERATOR TEMPLATE — not applied by kustomize (values required).
#
# The campaign send chain (Tulana import → HITL review → consent-gated send →
# Resend webhook attribution) fails CLOSED until these three secrets exist.
# Deployments already reference this secret via optional envFrom
# (web-deployment.yaml / worker-deployment.yaml), so creating it + restarting
# the pods is the entire remaining wiring.
#
# 1) Mint the two HMAC secrets (share PHYND_CAMPAIGN_IMPORT_SECRET with the
#    Selva side — nexus-api signs imports with the same value):
#      openssl rand -hex 32   # once per secret
#
# 2) Create the Resend webhook (Dashboard → Webhooks → Add):
#      endpoint: https://crm.madfam.io/api/webhooks/resend
#      events:   email.sent, email.delivered, email.opened, email.clicked,
#                email.bounced, email.complained
#    and copy its signing secret (whsec_…) into RESEND_WEBHOOK_SECRET.
#
# 3) Apply:
#      kubectl -n phynd-crm create secret generic phynd-crm-campaign-secrets \
#        --from-literal=PHYND_CAMPAIGN_IMPORT_SECRET=... \
#        --from-literal=PHYND_CONSENT_EVENTS_SECRET=... \
#        --from-literal=RESEND_WEBHOOK_SECRET=whsec_...
#      kubectl -n phynd-crm rollout restart deploy/phynd-crm-web deploy/phynd-crm-worker
#
# 4) Mirror PHYND_CAMPAIGN_IMPORT_SECRET into the Selva side (nexus-api env)
#    and, for hygiene, back-fill all three into Vault secret/phynd-crm so the
#    ExternalSecret can own them later (properties: campaign_import_secret,
#    consent_events_secret, resend_webhook_secret).
apiVersion: v1
kind: Secret
metadata:
  name: phynd-crm-campaign-secrets
  namespace: phynd-crm
type: Opaque
stringData:
  PHYND_CAMPAIGN_IMPORT_SECRET: "__MINT_ME__"
  PHYND_CONSENT_EVENTS_SECRET: "__MINT_ME__"
  RESEND_WEBHOOK_SECRET: "__FROM_RESEND_DASHBOARD__"
