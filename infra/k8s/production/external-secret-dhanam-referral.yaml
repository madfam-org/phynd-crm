# =============================================================================
# phynd-crm-dhanam-referral <- Vault secret/dhanam/referral   SPEC ONLY, NOT WIRED
# =============================================================================
# The worker's referral-reward-dispatch job signs POST /v1/referral/reward to
# Dhanam with DHANAM_REFERRAL_WEBHOOK_SECRET
# (apps/worker/src/processors/referral-reward-dispatch.ts). Dhanam verifies it,
# so Dhanam's Vault path holds the one canonical copy (verifier-owns) and
# PhyndCRM reads that same property cross-path here, never a copy.
#
# Until this is wired the key is absent and every reward job FAILS visibly
# (error log `referral_reward_dispatch_unconfigured`, job kept in the queue's
# failed set for replay). Nothing is silently dropped.
#
# It is deliberately NOT listed in kustomization.yaml. Wire it only when, in
# this order:
#   1. the Enclii intake has minted the key ONCE:
#        enclii secrets intake submit dhanam/referral-webhook-secret \
#          --generate referral_webhook_secret
#      (re-running it mints a different value: a rotation, not a retry);
#   2. Dhanam has wired its own ExternalSecret (dhanam-referral-webhook) and
#      restarted dhanam-api: from then on Dhanam verifies rewards ONLY with
#      this key;
#   3. then, in ONE PhyndCRM PR:
#        a. uncomment the entry in kustomization.yaml;
#        b. add to worker-deployment.yaml envFrom:
#             - secretRef:
#                 name: phynd-crm-dhanam-referral
#                 optional: true
#        c. flip WIRED in scripts/__tests__/dhanam-referral-externalsecret.test.mjs;
#   4. after the Secret syncs, restart phynd-crm-worker (env is read at pod
#      start) and replay the reward jobs left in the failed set.
#
# Why the property must exist before this reaches main: ESO is all-or-nothing
# and Argo shows a failing ExternalSecret as Degraded.
#
# Own Secret (creationPolicy Owner): a missing Vault property fails only this
# resource, never phynd-crm-secrets. deletionPolicy Retain: a Vault outage
# never empties it. Production only: staging never reads secret/dhanam/*.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phynd-crm-dhanam-referral
  namespace: phynd-crm
  labels:
    app.kubernetes.io/name: phynd-crm-dhanam-referral
    app.kubernetes.io/part-of: phynd-crm
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: phynd-crm-dhanam-referral
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DHANAM_REFERRAL_WEBHOOK_SECRET
      remoteRef:
        key: secret/dhanam/referral
        property: referral_webhook_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
