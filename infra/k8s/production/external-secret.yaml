apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phynd-crm-secrets
  namespace: phynd-crm
  labels:
    app.kubernetes.io/name: phynd-crm-secrets
    app.kubernetes.io/part-of: phynd-crm
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: phynd-crm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/phynd-crm
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/phynd-crm
        property: redis_url
    - secretKey: AUTH_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: auth_secret
    - secretKey: AUTH_JANUA_ISSUER
      remoteRef:
        key: secret/phynd-crm
        property: auth_janua_issuer
    - secretKey: AUTH_JANUA_CLIENT_ID
      remoteRef:
        key: secret/phynd-crm
        property: auth_janua_client_id
    - secretKey: AUTH_JANUA_CLIENT_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: auth_janua_client_secret
    - secretKey: JANUA_API_URL
      remoteRef:
        key: secret/phynd-crm
        property: janua_api_url
    - secretKey: DHANAM_API_URL
      remoteRef:
        key: secret/phynd-crm
        property: dhanam_api_url
    - secretKey: COTIZA_API_URL
      remoteRef:
        key: secret/phynd-crm
        property: cotiza_api_url
    - secretKey: PRAVARA_BASE_URL
      remoteRef:
        key: secret/phynd-crm
        property: pravara_base_url
    - secretKey: FORJ_API_URL
      remoteRef:
        key: secret/phynd-crm
        property: forj_api_url
    - secretKey: PRAVARA_API_KEY
      remoteRef:
        key: secret/phynd-crm
        property: pravara_api_key
    - secretKey: NEXT_PUBLIC_APP_URL
      remoteRef:
        key: secret/phynd-crm
        property: next_public_app_url
    - secretKey: NODE_ENV
      remoteRef:
        key: secret/phynd-crm
        property: node_env
