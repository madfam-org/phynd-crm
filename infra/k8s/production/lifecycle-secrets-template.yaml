# Break-glass lifecycle seam secrets — populate via Enclii/Vault, then:
#   kubectl create secret generic phynd-crm-lifecycle-secrets --namespace=phynd-crm \
#     --from-literal=PHYND_ENGAGEMENT_EVENTS_SECRET=... \
#     --from-literal=DHANAM_WEBHOOK_SECRET=... \
#     --from-literal=PRAVARA_API_KEY=... \
#     --from-literal=PHYNDCRM_OUTBOUND_SECRET=...
#
# Distinct from production webhook values used on staging. Register provider
# destinations after rotating these values.
#
# Dispatch: production-dispatch-http accepts PRAVARA_API_KEY or HMAC via
# PRAVARA_DISPATCH_SECRET / PHYNDCRM_OUTBOUND_SECRET (same for Selva).
---
apiVersion: v1
kind: Secret
metadata:
  name: phynd-crm-lifecycle-secrets
  namespace: phynd-crm
type: Opaque
stringData:
  PORTAL_BASE_URL: "https://crm.madfam.io"
  PHYND_ENGAGEMENT_EVENTS_SECRET: ""
  DHANAM_WEBHOOK_SECRET: ""
  PRAVARA_API_KEY: ""
  PRAVARA_DISPATCH_SECRET: ""
  PHYNDCRM_OUTBOUND_SECRET: ""
  SELVA_API_URL: "https://selva-api.madfam.io"
  SELVA_DISPATCH_SECRET: ""
