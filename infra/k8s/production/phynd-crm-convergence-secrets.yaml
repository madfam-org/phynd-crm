# Bearer token for the convergence read API (GET /api/v1/convergence/*),
# which converge-dash (dash.madfam.io) calls to ingest the CRM pipeline.
# Contract: docs/CONVERGENCE_API.md.
#
# phynd verifies the token, so per the "verifier-owns" convention the
# canonical value lives in phynd's Vault path (secret/phynd-crm, property
# convergence_api_token). converge-dash presents the SAME value as its
# PHYND_CRM_API_TOKEN (secret/converge-dash, property phynd_crm_api_token).
#
# A DEDICATED target Secret, like phynd-crm-integration-secrets: with
# creationPolicy Owner, ESO parks the whole target Secret while a mapped
# property is missing from Vault. Until the property is seeded this Secret is
# simply absent; the web Deployment references it with optional: true, so the
# pod starts without it and the convergence routes answer 401 "not configured".
#
# Activation (operator):
#   1. seed secret/phynd-crm convergence_api_token (one `vault kv patch`), and
#      the same value as secret/converge-dash phynd_crm_api_token;
#   2. wait for ESO to sync (refreshInterval 15m) or force a refresh;
#   3. rollout restart deploy/phynd-crm-web (env is read at container start).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phynd-crm-convergence-secrets
  namespace: phynd-crm
  labels:
    app.kubernetes.io/name: phynd-crm-convergence-secrets
    app.kubernetes.io/part-of: phynd-crm
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: phynd-crm-convergence-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CONVERGENCE_API_TOKEN
      remoteRef:
        key: secret/phynd-crm
        property: convergence_api_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
