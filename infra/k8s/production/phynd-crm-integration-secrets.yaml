# Dedicated ExternalSecret for phynd's cross-service integration secrets —
# the HMAC/bearer values phynd VERIFIES when peer services (selva, fortuna,
# karafiel) call it. phynd is the verifier, so per the "verifier-owns"
# convention it is the ESO owner of the canonical value in its own Vault
# path (secret/phynd-crm); peers read the SAME property cross-path.
#
# Why a DEDICATED secret (not appended to the core phynd-crm-secrets ES):
#   creationPolicy Owner is all-or-nothing — ESO parks the WHOLE target
#   Secret if any mapped property is missing in Vault. Keeping these five
#   integration properties in their own target Secret means an un-seeded
#   property parks ONLY this Secret (its consumers mount it optional:true),
#   never the core (DATABASE_URL, AUTH_SECRET, Janua creds) that boots the app.
#
# Activation is a separate, ordered cutover (NOT done by this manifest):
#   1. operator seeds all five properties into secret/phynd-crm in one
#      `vault kv patch` (switchyard-secret-writer token; no root) BEFORE this
#      syncs — see internal-devops runbook 2026-07-19-phynd-selva-autoprovision.md;
#   2. web/worker deployments add an OPTIONAL secretRef to
#      phynd-crm-integration-secrets AND the duplicate keys are removed from the
#      hand-created phynd-crm-campaign-secrets / phynd-crm-commercial-ga-secrets
#      (envFrom last-wins would otherwise shadow the ESO value);
#   3. rollout restart web+worker.
# Until then this Secret is created-but-unconsumed (inert), or parked if
# unseeded — either way zero blast radius on the running app.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phynd-crm-integration-secrets
  namespace: phynd-crm
  labels:
    app.kubernetes.io/name: phynd-crm-integration-secrets
    app.kubernetes.io/part-of: phynd-crm
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: phynd-crm-integration-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # selva nexus-api signs campaign imports with this; phynd verifies (RFC 0031).
    - secretKey: PHYND_CAMPAIGN_IMPORT_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: phynd_campaign_import_secret
    # selva/office federation presents this bearer; phynd verifies (service:selva).
    - secretKey: FEDERATION_API_TOKEN
      remoteRef:
        key: secret/phynd-crm
        property: federation_api_token
    # cross-product consent/suppression callers (karafiel, selva) sign; phynd verifies.
    - secretKey: PHYND_CONSENT_EVENTS_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: phynd_consent_events_secret
    # fortuna presents this on grant webhooks + /campaigns/trigger; phynd verifies.
    - secretKey: FORTUNA_WEBHOOK_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: fortuna_webhook_secret
    # config (not a secret): brings prod to staging parity for the selva push URL.
    - secretKey: SELVA_API_URL
      remoteRef:
        key: secret/phynd-crm
        property: selva_api_url
