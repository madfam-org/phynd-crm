# HMAC key for POST /api/webhooks/lead-intake (README § Lead-intake webhook),
# which receives lead events from three senders: Kalya bookings, the public
# site's contact forms and Cotiza quote requests.
#
# phynd verifies the signature, so per the "verifier-owns" convention the
# canonical value lives in phynd's Vault path (secret/phynd-crm, property
# lead_intake_secret). The three senders present the SAME value as their own
# lead-intake secret (property phynd_crm_lead_intake_secret in their Vault
# paths; ExternalSecrets kalya-phynd-crm-lead-intake,
# madfam-site-phynd-crm-lead-intake and digifab-quoting-phynd-crm-lead-intake).
# All four must be equal or every delivery fails with 401.
#
# A DEDICATED target Secret, like phynd-crm-convergence-secrets: with
# creationPolicy Owner, ESO parks the whole target Secret while a mapped
# property is missing from Vault. Until the property is provisioned this Secret
# is simply absent; the web Deployment references it with optional: true, so
# the pod starts without it and the route answers 503 "not configured".
#
# Activation (operator):
#   1. provision the value through the platform's secret intake (it writes
#      secret/phynd-crm lead_intake_secret and the same value to the three
#      senders' paths);
#   2. wait for ESO to sync (refreshInterval 15m) or force a refresh;
#   3. rollout restart deploy/phynd-crm-web (env is read at container start).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phynd-crm-lead-intake
  namespace: phynd-crm
  labels:
    app.kubernetes.io/name: phynd-crm-lead-intake
    app.kubernetes.io/part-of: phynd-crm
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: phynd-crm-lead-intake
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PHYND_CRM_LEAD_INTAKE_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: lead_intake_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
