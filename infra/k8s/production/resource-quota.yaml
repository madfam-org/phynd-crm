---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: phynd-crm-quota
  namespace: phynd-crm
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: phynd-crm-limits
  namespace: phynd-crm
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
