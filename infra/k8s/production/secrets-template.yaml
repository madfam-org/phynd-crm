# PhyneCRM Secrets Template — NEVER commit with real values
# Use: kubectl create secret generic phyne-crm-secrets --namespace=phyne-crm --from-literal=...
#
# Required (app fails to start without these):
#   DATABASE_URL, REDIS_URL, AUTH_SECRET, AUTH_JANUA_ISSUER,
#   AUTH_JANUA_CLIENT_ID, AUTH_JANUA_CLIENT_SECRET, JANUA_API_URL,
#   DHANAM_API_URL, COTIZA_API_URL, PRAVARA_BASE_URL, FORJ_API_URL,
#   PRAVARA_API_KEY
#
# Optional (features degrade gracefully):
#   All webhook secrets, OPENAI_*, RESEND_*, REDDIT_*, KARAFIEL_*,
#   FEDERATION_API_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: phyne-crm-secrets
  namespace: phyne-crm
type: Opaque
stringData:
  # Database (shared Postgres in data namespace)
  DATABASE_URL: "postgresql://phyne:<PASSWORD>@pgbouncer.data.svc.cluster.local:6432/phyne_crm"
  REDIS_URL: "redis://redis.data.svc.cluster.local:6379"

  # Auth (Janua OIDC)
  AUTH_SECRET: ""
  AUTH_JANUA_ISSUER: "https://auth.madfam.io"
  AUTH_JANUA_CLIENT_ID: ""
  AUTH_JANUA_CLIENT_SECRET: ""

  # Federation — External Service URLs (required)
  JANUA_API_URL: "https://auth.madfam.io"
  DHANAM_API_URL: "https://api.dhan.am"
  COTIZA_API_URL: "https://cotiza.studio"
  PRAVARA_BASE_URL: "https://mes-api.madfam.io"
  FORJ_API_URL: "https://forj.design"
  PRAVARA_API_KEY: ""

  # Federation — Tezca (optional)
  TEZCA_API_URL: "https://api.tezca.mx"
  TEZCA_WEBHOOK_SECRET: ""
  INTERNAL_TEZCA_KEY: ""

  # Federation — Webhook Secrets (optional, routes return 503 when unconfigured)
  JANUA_WEBHOOK_SECRET: ""
  DHANAM_WEBHOOK_SECRET: ""
  COTIZA_WEBHOOK_SECRET: ""
  PRAVARA_WEBHOOK_SECRET: ""
  FORJ_WEBHOOK_SECRET: ""

  # Fortuna → PhyneCRM grant signal webhook (optional)
  FORTUNA_WEBHOOK_SECRET: ""

  # Service-to-service federation token (optional, enables AutoSwarm → tRPC calls)
  FEDERATION_API_TOKEN: ""

  # ACCA Treasury Hunter — Karafiel compliance (optional)
  KARAFIEL_API_URL: ""
  KARAFIEL_API_KEY: ""
  KARAFIEL_WEBHOOK_SECRET: ""

  # LLM routing via AutoSwarm Nexus (optional)
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: "http://nexus-api.autoswarm.svc.cluster.local/v1"

  # Email drip via Resend (optional)
  RESEND_API_KEY: ""

  # Reddit bot (optional)
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  REDDIT_REFRESH_TOKEN: ""
  REDDIT_BOT_USERNAME: "madfam-bot"

  # App
  NEXT_PUBLIC_APP_URL: "https://crm.madfam.io"
  NODE_ENV: "production"
