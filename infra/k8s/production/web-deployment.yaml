apiVersion: apps/v1
kind: Deployment
metadata:
  name: phynd-crm-web
  namespace: phynd-crm
  labels:
    app: phynd-crm-web
    app.kubernetes.io/name: phynd-crm-web
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phynd-crm-web
  template:
    metadata:
      labels:
        app: phynd-crm-web
        app.kubernetes.io/name: phynd-crm-web
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          image: ghcr.io/madfam-org/phynd-crm/web@sha256:52d183d3f8e0746685e1057e7f5ef0cd1d192e8a5cddd155c06c562c5b6e034a
          ports:
            - containerPort: 3000
          env:
            - name: PHYND_CRM_PUBLIC_URL
              value: "https://crm.madfam.io"
            # Sender identity for outbound mail. Overrides the code default
            # (email.service.ts: 'Tezca <noreply@janua.dev>') which sent from
            # the wrong product's domain. madfam.io is a verified Resend
            # sender. NOTE: the drip/welcome templates are still Tezca-branded;
            # revisit both sender + templates per the launch-product (G3) call.
            - name: EMAIL_FROM
              value: "MADFAM <noreply@madfam.io>"
            # Who hears about a new nauta-landing lead. Comma-separated.
            # Configuration, not code: the person on point changes more often
            # than a release ships. Unset ⇒ the webhook logs a loud warning
            # and still stores the lead — notification is best-effort by design.
            - name: NAUTA_LEADS_NOTIFY_EMAIL
              value: "aldo@madfam.io"
            - name: TULANA_API_BASE_URL
              value: "https://tulana-api.madfam.io/api/v1"
            - name: TULANA_COMMERCIAL_GA_ENVIRONMENT
              value: "production"
            - name: TULANA_COMMERCIAL_GA_PERIOD
              value: "2026-06"
            # Janua client_credentials machine tokens (docs/MACHINE_AUTH.md).
            # Both set = ON: a JWT bearer is verified against AUTH_JANUA_ISSUER's
            # JWKS, must carry org_id == the org below, and acts in the tenant
            # below with only MACHINE_SCOPE_GRANTS scopes (read-only today).
            # Neither value is a secret; the org UUID is the madfam-ecosystem
            # Janua organization the machine clients are bound to. Rollback:
            # delete PHYND_CRM_MACHINE_TENANT_ID (either one unset = off).
            - name: PHYND_CRM_MACHINE_TENANT_ID
              value: "madfam"
            - name: PHYND_CRM_MACHINE_JANUA_ORG_ID
              value: "1a6233ef-185f-43ee-9181-e2591fbb2643"
            # Bearer for GET /api/v1/convergence/* (converge-dash ingestion).
            # Optional: until phynd-crm-convergence-secrets exists the pod still
            # starts and those routes answer 401 "not configured" (fail closed).
            # Must equal converge-dash's PHYND_CRM_API_TOKEN. See
            # phynd-crm-convergence-secrets.yaml and docs/CONVERGENCE_API.md.
            - name: CONVERGENCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: phynd-crm-convergence-secrets
                  key: CONVERGENCE_API_TOKEN
                  optional: true
          envFrom:
            - secretRef:
                name: phynd-crm-secrets
            - secretRef:
                name: phynd-crm-pilot-overlay
            - secretRef:
                name: phynd-crm-events-secret
            - secretRef:
                name: phynd-crm-lifecycle-secrets
                optional: true
            - secretRef:
                name: phynd-crm-campaign-secrets
                optional: true
            - secretRef:
                name: phynd-crm-commercial-ga-secrets
                optional: true
            - secretRef:
                name: phynd-acca-secrets
                optional: true
            # R2_BUCKET_NAME / R2_ENDPOINT_URL / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
            # for private payment evidence, written by
            # `enclii buckets create phynd-crm-payment-evidence --project phynd-crm`
            # (docs/runbooks/payment-evidence-storage.md). Optional: without it,
            # receipt upload answers 503 and payments are recorded without a file.
            - secretRef:
                name: phynd-crm-credentials
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
