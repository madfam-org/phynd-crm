apiVersion: apps/v1
kind: Deployment
metadata:
  name: phynd-crm-web
  namespace: phynd-crm
  labels:
    app: phynd-crm-web
    app.kubernetes.io/name: phynd-crm-web
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phynd-crm-web
  template:
    metadata:
      labels:
        app: phynd-crm-web
        app.kubernetes.io/name: phynd-crm-web
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          image: ghcr.io/madfam-org/phynd-crm/web@sha256:52d183d3f8e0746685e1057e7f5ef0cd1d192e8a5cddd155c06c562c5b6e034a
          ports:
            - containerPort: 3000
          env:
            - name: PHYND_CRM_PUBLIC_URL
              value: "https://crm.madfam.io"
            # Sender identity for outbound mail. Overrides the code default
            # (email.service.ts: 'Tezca <noreply@janua.dev>') which sent from
            # the wrong product's domain. madfam.io is a verified Resend
            # sender. NOTE: the drip/welcome templates are still Tezca-branded;
            # revisit both sender + templates per the launch-product (G3) call.
            - name: EMAIL_FROM
              value: "MADFAM <noreply@madfam.io>"
            - name: TULANA_API_BASE_URL
              value: "https://tulana-api.madfam.io/api/v1"
            - name: TULANA_COMMERCIAL_GA_ENVIRONMENT
              value: "production"
            - name: TULANA_COMMERCIAL_GA_PERIOD
              value: "2026-06"
          envFrom:
            - secretRef:
                name: phynd-crm-secrets
            - secretRef:
                name: phynd-crm-pilot-overlay
            - secretRef:
                name: phynd-crm-events-secret
            - secretRef:
                name: phynd-crm-lifecycle-secrets
                optional: true
            - secretRef:
                name: phynd-crm-campaign-secrets
                optional: true
            - secretRef:
                name: phynd-crm-commercial-ga-secrets
                optional: true
            - secretRef:
                name: phynd-acca-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
