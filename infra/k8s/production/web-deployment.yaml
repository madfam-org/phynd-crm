apiVersion: apps/v1
kind: Deployment
metadata:
  name: phynd-crm-web
  namespace: phynd-crm
  labels:
    app: phynd-crm-web
    app.kubernetes.io/name: phynd-crm-web
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phynd-crm-web
  template:
    metadata:
      labels:
        app: phynd-crm-web
        app.kubernetes.io/name: phynd-crm-web
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          image: ghcr.io/madfam-org/phynd-crm/web@sha256:52d183d3f8e0746685e1057e7f5ef0cd1d192e8a5cddd155c06c562c5b6e034a
          ports:
            - containerPort: 3000
          env:
            - name: PHYND_CRM_PUBLIC_URL
              value: "https://crm.madfam.io"
            # Sender identity for outbound mail. Overrides the code default
            # (email.service.ts: 'Tezca <noreply@janua.dev>') which sent from
            # the wrong product's domain. madfam.io is a verified Resend
            # sender. NOTE: the drip/welcome templates are still Tezca-branded;
            # revisit both sender + templates per the launch-product (G3) call.
            - name: EMAIL_FROM
              value: "MADFAM <noreply@madfam.io>"
            # Who hears about every new real lead (Avala, Nauta, Kalya, the
            # site, Cotiza, ceq, tezca): one alert per lead, never for test
            # leads. Comma-separated. Ruling V8 (2026-11-15): hola@ is the
            # conversation and sales inbox; it is also the code default
            # (apps/web/src/lib/webhooks/lead-alert.ts), so this line only
            # makes it explicit. Best effort by design.
            - name: LEADS_NOTIFY_EMAIL
              value: "hola@madfam.io"
            # DEPRECATED: read only by images built before the shared lead
            # alert (they sent nauta leads here). Images with lead-alert.ts
            # ignore it. Delete this entry once such an image is promoted.
            - name: NAUTA_LEADS_NOTIFY_EMAIL
              value: "aldo@madfam.io"
            # Owner of tasks the system opens on a contact without owner
            # (lead-intake follow-up, Dhanam failed payment): the operator's
            # account, as janua:<subject>. It names a person's account, so it
            # comes from the dedicated ExternalSecret phynd-crm-default-task-owner
            # (phynd-crm-staff-access.yaml). Optional: absent, or no such CRM
            # user, those tasks stay unassigned with DEFAULT_TASK_OWNER_UNAVAILABLE.
            - name: PHYND_CRM_DEFAULT_TASK_OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: phynd-crm-default-task-owner
                  key: PHYND_CRM_DEFAULT_TASK_OWNER_ID
                  optional: true
            # Staff bootstrap: <role>:sub:<subject> entries whose account gets
            # its CRM user, with that role, on first sign-in (docs/DEPLOYMENT.md § Staff access). Names people's
            # accounts, so it comes from the dedicated ExternalSecret
            # phynd-crm-staff-bootstrap (phynd-crm-staff-access.yaml). Optional:
            # absent = no bootstrap; access is granted in the CRM's Users screen.
            - name: PHYND_BOOTSTRAP_STAFF
              valueFrom:
                secretKeyRef:
                  name: phynd-crm-staff-bootstrap
                  key: PHYND_BOOTSTRAP_STAFF
                  optional: true
            - name: TULANA_API_BASE_URL
              value: "https://tulana-api.madfam.io/api/v1"
            - name: TULANA_COMMERCIAL_GA_ENVIRONMENT
              value: "production"
            - name: TULANA_COMMERCIAL_GA_PERIOD
              value: "2026-06"
            # Bearer for GET /api/v1/convergence/* (converge-dash ingestion).
            # Optional: until phynd-crm-convergence-secrets exists the pod still
            # starts and those routes answer 401 "not configured" (fail closed).
            # Must equal converge-dash's PHYND_CRM_API_TOKEN. See
            # phynd-crm-convergence-secrets.yaml and docs/CONVERGENCE_API.md.
            - name: CONVERGENCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: phynd-crm-convergence-secrets
                  key: CONVERGENCE_API_TOKEN
                  optional: true
            # HMAC key for POST /api/webhooks/lead-intake (Kalya, public site,
            # Cotiza). Optional: until phynd-crm-lead-intake exists the pod
            # still starts and the route answers 503 "not configured". Must
            # equal the three senders' lead-intake secret. Activation: provision
            # through the platform's secret intake, wait for ESO sync, then
            # rollout restart this Deployment. See phynd-crm-lead-intake.yaml.
            - name: PHYND_CRM_LEAD_INTAKE_SECRET
              valueFrom:
                secretKeyRef:
                  name: phynd-crm-lead-intake
                  key: PHYND_CRM_LEAD_INTAKE_SECRET
                  optional: true
          envFrom:
            - secretRef:
                name: phynd-crm-secrets
            - secretRef:
                name: phynd-crm-pilot-overlay
            - secretRef:
                name: phynd-crm-events-secret
            - secretRef:
                name: phynd-crm-lifecycle-secrets
                optional: true
            - secretRef:
                name: phynd-crm-campaign-secrets
                optional: true
            - secretRef:
                name: phynd-crm-commercial-ga-secrets
                optional: true
            - secretRef:
                name: phynd-acca-secrets
                optional: true
            # R2_BUCKET_NAME / R2_ENDPOINT_URL / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
            # for private payment evidence, written by
            # `enclii buckets create phynd-crm-payment-evidence --project phynd-crm`
            # (docs/runbooks/payment-evidence-storage.md). Optional: without it,
            # receipt upload answers 503 and payments are recorded without a file.
            - secretRef:
                name: phynd-crm-credentials
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
