apiVersion: apps/v1
kind: Deployment
metadata:
  name: phynd-crm-worker
  namespace: phynd-crm
  labels:
    app: phynd-crm-worker
    app.kubernetes.io/name: phynd-crm-worker
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phynd-crm-worker
  template:
    metadata:
      labels:
        app: phynd-crm-worker
        app.kubernetes.io/name: phynd-crm-worker
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/madfam-org/phynd-crm/worker@sha256:b3249871cc4d4cac65e4d11173b709e4c0dd660efd0d3d98836fb01d63aeb7e6
          ports:
            - name: health
              containerPort: 3001
          env:
            - name: WORKER_HEALTH_PORT
              value: "3001"
            - name: PHYND_CRM_PUBLIC_URL
              value: "https://crm.madfam.io"
            # Sender identity for the drip/campaign worker sends. Overrides the
            # code default 'Tezca <noreply@janua.dev>' (wrong product domain);
            # madfam.io is a verified Resend sender. Templates are still
            # Tezca-branded — revisit sender + templates per the G3 launch call.
            - name: EMAIL_FROM
              value: "MADFAM <noreply@madfam.io>"
            - name: TULANA_API_BASE_URL
              value: "https://tulana-api.madfam.io/api/v1"
            - name: TULANA_COMMERCIAL_GA_ENVIRONMENT
              value: "production"
            - name: TULANA_COMMERCIAL_GA_PERIOD
              value: "2026-06"
          envFrom:
            - secretRef:
                name: phynd-crm-secrets
            - secretRef:
                name: phynd-crm-pilot-overlay
            - secretRef:
                name: phynd-crm-lifecycle-secrets
                optional: true
            - secretRef:
                name: phynd-crm-campaign-secrets
                optional: true
            - secretRef:
                name: phynd-crm-commercial-ga-secrets
                optional: true
            - secretRef:
                name: phynd-acca-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 30
