# PhyndCRM Staging Secrets Template — NEVER commit with real values
# Use: kubectl create secret generic phynd-crm-staging-secrets --namespace=phynd-crm-staging --from-literal=...
#
# This is a dedicated staging secret set. It must never be identical to
# production values for cross-service secrets (webhooks, API keys, SMTP).
---
apiVersion: v1
kind: Secret
metadata:
  name: phynd-crm-staging-secrets
  namespace: phynd-crm-staging
type: Opaque
stringData:
  # Database (staging DB, dedicated role)
  DATABASE_URL: "postgresql://phynd_staging:<PASSWORD>@pgbouncer.data.svc.cluster.local:6432/phynd_crm_staging"
  # BullMQ workers require a writable Redis endpoint. Do not use
  # redis-master.data.svc.cluster.local until it is a true master-only Service.
  REDIS_URL: "redis://:<REDIS_PASSWORD>@redis.data.svc.cluster.local:6379/0"

  # Auth (Janua OIDC)
  AUTH_SECRET: ""
  AUTH_JANUA_ISSUER: "https://auth.staging.madfam.io"
  AUTH_JANUA_CLIENT_ID: ""
  AUTH_JANUA_CLIENT_SECRET: ""

  # Federation — External Service URLs
  JANUA_API_URL: "https://api-staging.janua.example.com"
  JANUA_TELEMETRY_API_URL: "https://telemetry-staging.janua.example.com"
  DHANAM_API_URL: "https://api-staging.dhan.am"
  COTIZA_API_URL: "https://cotiza-staging.studio"
  PRAVARA_BASE_URL: "https://mes-api-staging.madfam.io"
  SELVA_API_URL: "https://selva-api-staging.madfam.io"
  FORJ_API_URL: "https://forj-staging.example.com"
  TEZCA_API_URL: "https://api-staging.tezca.mx"
  TEZCA_PUBLIC_URL: "https://tezca-staging.example.com"

  # Federation — API Keys
  PRAVARA_API_KEY: ""
  SELVA_API_KEY: ""

  # Paid production dispatch worker
  PRAVARA_DISPATCH_URL: ""
  SELVA_DISPATCH_URL: ""
  PRAVARA_DISPATCH_SECRET: ""
  SELVA_DISPATCH_SECRET: ""
  PRODUCTION_DISPATCH_SCAN_LIMIT: "25"
  PRODUCTION_DISPATCH_TIMEOUT_MS: "15000"

  # Federation — Webhook Secrets (all required for inbound webhook receivers)
  JANUA_WEBHOOK_SECRET: ""
  DHANAM_WEBHOOK_SECRET: ""
  COTIZA_WEBHOOK_SECRET: ""
  PRAVARA_WEBHOOK_SECRET: ""
  FORJ_WEBHOOK_SECRET: ""
  TEZCA_WEBHOOK_SECRET: ""
  FORTUNA_WEBHOOK_SECRET: ""
  JANUA_TELEMETRY_WEBHOOK_SECRET: ""
  PHYND_CRM_EVENTS_SECRET: ""
  # Previous secret, set only during a zero-downtime rotation window so the
  # receiver accepts both old and new signatures; cleared after the emitter cuts
  # over. See runbooks/2026-07-08-event-bus-reliability.md (internal-devops).
  PHYND_CRM_EVENTS_SECRET_PREVIOUS: ""
  COFORMA_WEBHOOK_SECRET: ""
  CEQ_WEBHOOK_SECRET: ""
  PHYND_ENGAGEMENT_EVENTS_SECRET: ""
  # Consent capture (products) + Resend engagement webhooks — see docs/CONSENT_API.md
  PHYND_CONSENT_EVENTS_SECRET: ""
  RESEND_WEBHOOK_SECRET: ""

  # Phase 2/3 — engagement + Tulana SKU loop
  SELVA_WEBHOOK_SECRET: ""
  PHYND_CAMPAIGN_IMPORT_SECRET: ""
  # Selva Panopticon iframe embed (dashboard routes only; keep false on prod until reviewed)
  PHYND_SELVA_EMBED_ALLOWED: "true"

  # Deployment tier guard (staging must not call production outbound URLs)
  PHYND_DEPLOYMENT_TIER: "staging"

  # Outbound webhook/auth integration (same pattern as inbound, different secrets where required)
  PHYNDCRM_OUTBOUND_SECRET: ""
  KARAFIEL_WEBHOOK_SECRET: ""

  # ACCA Treasury Hunter — Karafiel compliance integration
  KARAFIEL_API_URL: "https://staging-karafiel.madfam.io"
  KARAFIEL_API_KEY: ""

  # API surface / app
  NEXT_PUBLIC_APP_URL: "https://staging-crm.madfam.io"
  PORTAL_BASE_URL: "https://staging-crm.madfam.io"
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://staging-crm.madfam.io"
  WORKER_HEALTH_PORT: "3001"
  PHYND_CRM_PROBE_TOKEN: ""

  # LLM routing / Selva (optional)
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: "http://nexus-api.selva.svc.cluster.local/v1"

  # Federation service auth + legacy integration hooks
  FEDERATION_API_TOKEN: ""
  FEDERATION_SERVICE_USER_ID: "service:selva"
  FORTUNA_API_KEY: ""
  COTIZA_WEBHOOK_TIMEOUT: "10000"

  # Email drip / outbound email
  RESEND_API_KEY: ""
  EMAIL_FROM: "no-reply@staging.madfam.io"
  # Optional staging hardening: comma-separated recipient domains allowed for email-drip
  EMAIL_ALLOWLIST_DOMAINS: ""

  # Reddit bot (optional)
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  REDDIT_REFRESH_TOKEN: ""
  REDDIT_BOT_USERNAME: "madfam-bot-staging"
  REDDIT_TARGET_SUBREDDITS: "madfam-staging"
  REDDIT_USERNAME: ""
  REDDIT_PASSWORD: ""
  REDDIT_USER_AGENT: "madfam-staging/0.1"

  # Probing + analytics
  SENTRY_DSN: ""
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

  # Feature flags (staging defaults — enable only after split verification)
  FEATURE_TREASURY_HUNTER: "false"
  FEATURE_OBSERVABILITY: "false"
  FEATURE_AI_KANBAN: "false"
  FEATURE_PII_MASKING: "false"
