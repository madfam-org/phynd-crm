# Egress ports describe the DESTINATION (DNS 53, HTTPS 443) and have no
# relationship to the source pod's containerPorts. A lint that flagged this
# would be over-eager and would push people to disable it. Must PASS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
spec:
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: example/worker
          ports:
            - containerPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-egress
  namespace: demo
spec:
  podSelector:
    matchLabels: { app: worker }
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
